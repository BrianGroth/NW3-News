name: NW3 News Digest

on:
  schedule:
    # Runs every 3 hours. Cron is in UTC.
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit digest.md / seen.json back

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest script
        run: python nw3_digest.py

      - name: Commit updated files
        run: |
          git config user.name "nw3-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digest.md seen.json
          git diff --quiet --cached || git commit -m "Update NW3 digest"
          git push
